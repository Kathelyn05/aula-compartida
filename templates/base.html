<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AulaCompartida{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <nav class="sticky top-0 z-40 border-b border-slate-200 bg-white shadow-sm">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <a href="{% url 'home' %}" class="text-xl font-bold text-blue-600">AulaCompartida</a>

      <div id="profile-container" class="relative">
        <button
          id="profile-button"
          type="button"
          aria-haspopup="true"
          aria-expanded="false"
          aria-label="Menú de perfil"
          class="flex h-10 w-10 items-center justify-center rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500
            {% if user.is_authenticated %}bg-blue-600 text-white font-semibold{% else %}bg-gray-200 text-gray-600{% endif %}"
        >
          {% if user.is_authenticated %}
            {{ user.first_name|default:user.email|first|upper }}
          {% else %}
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          {% endif %}
        </button>

        <div id="profile-menu" class="absolute right-0 z-50 mt-2 hidden w-56 rounded-lg border border-gray-100 bg-white py-2 shadow-lg">
          {% if user.is_authenticated %}
            <div class="border-b border-gray-100 px-4 py-2 text-sm text-gray-500">
              Hola, <span class="font-semibold text-gray-900">{{ user.first_name|default:user.email }}</span>
            </div>
            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Mi perfil</a>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="block w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50">
                Cerrar sesión
              </button>
            </form>
          {% else %}
            <a href="{% url 'login' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Iniciar sesión</a>
            <a href="{% url 'register' %}" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Registrarse</a>
          {% endif %}
        </div>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-5xl px-4 py-8">
    {% if messages %}
      <div class="mb-6 space-y-2">
        {% for message in messages %}
          <div class="rounded-lg border px-4 py-3 text-sm {% if message.tags == 'success' %}border-green-200 bg-green-50 text-green-800{% elif message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% else %}border-blue-200 bg-blue-50 text-blue-800{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <script>
    const profileButton = document.getElementById('profile-button');
    const profileMenu = document.getElementById('profile-menu');

    profileButton.addEventListener('click', () => {
      const isHidden = profileMenu.classList.toggle('hidden');
      profileButton.setAttribute('aria-expanded', String(!isHidden));
    });

    document.addEventListener('click', (event) => {
      if (!profileMenu.classList.contains('hidden') && !event.target.closest('#profile-container')) {
        profileMenu.classList.add('hidden');
        profileButton.setAttribute('aria-expanded', 'false');
      }
    });
  </script>
</body>
</html>
