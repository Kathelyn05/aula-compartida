{% extends 'base.html' %}

{% block title %}Borrar recurso — AulaCompartida{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-gray-900 mb-4">Borrar recurso</h1>
  <p class="text-gray-700 mb-6">¿Seguro que quieres borrar <strong>{{ recurso.titulo }}</strong>?</p>

  <form method="post" class="flex gap-3">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium rounded-lg px-5 py-2">Borrar</button>
    <a href="{% url 'resources:recurso_detalle' recurso.pk %}" class="text-gray-600 hover:text-gray-800 px-3 py-2">Cancelar</a>
  </form>
</section>
{% endblock %}
