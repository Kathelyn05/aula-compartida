services:
  - type: web
    name: aula-compartida
    runtime: python
    plan: free
    buildCommand: './build.sh'
    startCommand: 'gunicorn config.wsgi:application'
    healthCheckPath: '/'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aula-compartida-db
          property: connectionString
      - key: PYTHON_VERSION
        value: '3.11.9'
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: ALLOWED_HOSTS
        value: 'aula-compartida.onrender.com'
      - key: CSRF_TRUSTED_ORIGINS
        value: 'https://aula-compartida.onrender.com,https://*.onrender.com'
      - key: B2_ACCESS_KEY_ID
        sync: false
      - key: B2_SECRET_ACCESS_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT_URL
        sync: false
      - key: B2_REGION_NAME
        sync: false

databases:
  - name: aula-compartida-db
    plan: free
